org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Permanent Play identity. Replace with the reverse of a domain you control BEFORE the first Play upload;
# it can never change afterwards. The Kotlin package (namespace) stays `lian.app` regardless.
lian.applicationId=lian.app.dev

# SHA-256 fingerprints (hex, comma-separated) of the certificates a genuine build may be signed with:
# the Play app-signing certificate and the off-Play release certificate. Empty until those keys exist;
# the Privacy proof screen then reports "not configured" instead of "genuine".
lian.expectedSigners=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
