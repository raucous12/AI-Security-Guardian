# Training datasets for the on-device models. Each source is pinned by URL and SHA-256; fetchCorpus
# refuses anything else. After reviewing an upstream change: ./gradlew :tools:trainer:fetchCorpus -Pml.acceptNewHashes=true
#
# Recorded in the model files and the model card so every shipped model names its exact inputs.
corpus.date=2026-10-01

# UCI SMS Spam Collection (Almeida, Gómez Hidalgo, Yamakami, 2011). CC BY 4.0.
uci.url=https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip
uci.sha256=1587ea43e58e82b14ff1f5425c88e17f8496bfcdb67a583dbff9eefaf9963ce3
uci.license=CC BY 4.0

# Mishra & Soni, "SMS Phishing Dataset for Machine Learning and Pattern Recognition", Mendeley Data
# v1, doi:10.17632/f45bkkt8pr.1. CC BY 4.0. (The SHA-256 is also published by Mendeley.)
mishra.url=https://data.mendeley.com/public-files/datasets/f45bkkt8pr/files/edb361de-918d-469f-9106-e84823830665/file_downloaded
mishra.sha256=9bbf3188fdad81495d8e82825648b9b63b53fc86841a3d26c02629990b233cc3
mishra.license=CC BY 4.0

# Phishing.Database (Mitchell Krog, Nissar Chababy), active phishing domains at a pinned commit. MIT.
phishdb.url=https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/568f13d66aa0a321f34b72d4d3aeca879bc663dc/phishing-domains-ACTIVE.txt
phishdb.sha256=1739b070c2f565d7df6d697565be371a82520d00f3f9701964257495de2c4ec1
phishdb.license=MIT

# Majestic Million (Majestic-12 Ltd), most-linked domains, snapshot of corpus.date. CC BY 3.0.
